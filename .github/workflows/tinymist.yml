# Builds tinymist (the Typst language server) for the browser and attaches it
# to a release, where scripts/build.py --editor picks it up. Run it by hand
# (Actions > tinymist > Run workflow) when bumping TINYMIST_VERSION.
name: tinymist

on:
  workflow_dispatch:
    inputs:
      version:
        description: tinymist version (a tag of Myriad-Dreamin/tinymist, without the v)
        default: "0.15.2"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out tinymist
        run: git clone --depth 1 --branch "v$VERSION" https://github.com/Myriad-Dreamin/tinymist.git
      - name: Install Rust and wasm-pack
        run: |
          cd tinymist
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
          curl -sSfL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tinymist
      - name: Build
        run: |
          cd tinymist/crates/tinymist
          wasm-pack build --target web --release -- --no-default-features --features web,no-content-hint
          cd pkg
          gzip -9 -k tinymist_bg.wasm
          tar czf "$GITHUB_WORKSPACE/tinymist-web-$VERSION.tar.gz" tinymist.js tinymist_bg.wasm.gz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "tinymist-$VERSION" "tinymist-web-$VERSION.tar.gz" \
            --repo "$GITHUB_REPOSITORY" --title "tinymist $VERSION for the browser editor" \
            --notes "Built from Myriad-Dreamin/tinymist v$VERSION with wasm-pack (web, no-content-hint)." \
          || gh release upload "tinymist-$VERSION" "tinymist-web-$VERSION.tar.gz" --repo "$GITHUB_REPOSITORY" --clobber
