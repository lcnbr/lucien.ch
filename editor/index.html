<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Edit · Lucien</title>
  <link rel="stylesheet" href="editor.css">
  <script type="importmap">
    {
      "imports": {
        "typst-wasm": "./vendor/typst-wasm/index.js",
        "typst-wasm/worker/browser": "./vendor/typst-wasm/worker/browser.js",
        "nanotar": "./vendor/nanotar/index.mjs"
      }
    }
  </script>
</head>
<body>
  <header class="bar">
    <a class="home" href="/">Lucien</a>
    <select id="file" aria-label="File"></select>
    <button id="new" type="button">New…</button>
    <span id="status" class="status" role="status">Loading…</span>
    <span class="spacer"></span>
    <a id="view" class="view" href="/" target="_blank" rel="noopener">View page</a>
    <button id="save" type="button" class="primary" disabled>Save</button>
    <button id="settings" type="button" aria-label="Settings">⚙</button>
  </header>

  <main class="panes">
    <section class="pane source">
      <div id="editor"></div>
      <ol id="diagnostics" class="diagnostics" aria-label="Compiler messages"></ol>
    </section>
    <section class="pane preview">
      <iframe id="preview" title="Preview"></iframe>
    </section>
  </main>

  <dialog id="settings-dialog">
    <form method="dialog">
      <h2>GitHub access</h2>
      <p>Saving commits straight to <code id="repo-name"></code>. Create a
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">fine-grained token</a>
        for this repository only, with <b>Contents: read and write</b>. It is kept in this browser's local storage and sent only to api.github.com.</p>
      <label>Token <input id="token" type="password" autocomplete="off" spellcheck="false"></label>
      <label>Branch <input id="branch" type="text" spellcheck="false"></label>
      <menu>
        <button value="forget" type="submit" class="quiet">Forget token</button>
        <button value="cancel" type="submit">Cancel</button>
        <button value="ok" type="submit" class="primary">Save settings</button>
      </menu>
    </form>
  </dialog>

  <dialog id="new-dialog">
    <form method="dialog">
      <h2>New page</h2>
      <label>Kind
        <select id="new-kind">
          <option value="note">Garden note</option>
          <option value="post">Blog post</option>
          <option value="page">Page</option>
        </select>
      </label>
      <label>Title <input id="new-title" type="text" required></label>
      <label>Slug <input id="new-slug" type="text" pattern="[a-z0-9][a-z0-9-]*" required spellcheck="false"></label>
      <menu>
        <button value="cancel" type="submit" formnovalidate>Cancel</button>
        <button value="ok" type="submit" class="primary">Create</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="editor.js"></script>
</body>
</html>
